# Render Blueprint — deploys Insider-Shield as a single Docker web
# service on Render's free plan. See README.md's "Deploying to Render"
# section for the full walkthrough (Turso setup, first-deploy migration
# step, etc.) — this file alone isn't sufficient without a Turso
# database already provisioned.
#
# `sync: false` vars are prompted for once at first deploy (or set later
# in the Render dashboard) and never stored in this file — DATABASE_URL
# and TURSO_AUTH_TOKEN come from your Turso account, not from Render.
# `generateValue: true` vars are random-generated by Render itself on
# first deploy; copy the generated ORG_ACCESS_KEY into the Chrome
# extension's managed policy / options page separately.

services:
  - name: insider-shield
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ORG_ACCESS_KEY
        generateValue: true
      - key: BEARER_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
