<!--
  Source of truth for the extension's toolbar/management icons.
  The PNGs beside this file are generated from it — regenerate with:
    npx tsx scripts/generate-extension-icons.ts

  Deliberately a solid emerald shield on a dark rounded square rather
  than a detailed outline: extension icons render at 16x16 in the
  toolbar, where thin strokes and interior detail turn to mush. Colors
  match the dashboard's own shield mark (emerald-400 on slate-950, see
  src/components/layout/Sidebar.tsx).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#020617" />
  <g transform="translate(13.6,13.6) scale(4.2)">
    <path
      d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
      fill="#34d399"
    />
  </g>
</svg>
